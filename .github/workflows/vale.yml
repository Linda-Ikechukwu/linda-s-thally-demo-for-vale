name: Vale

on:
  push:
    branches: [main]
    paths:
      - "src/content/**"
      - ".vale.ini"
      - ".github/vale/**"
      - ".github/workflows/vale.yml"
  pull_request:
    paths:
      - "src/content/**"
      - ".vale.ini"
      - ".github/vale/**"
      - ".github/workflows/vale.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vale:
    name: Lint docs prose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Installs Vale, runs `vale sync` (downloads the Google package listed
      # in .vale.ini), then lints every page under src/content.
      - uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.24.0
          files: src/content
          filter_mode: nofilter
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
