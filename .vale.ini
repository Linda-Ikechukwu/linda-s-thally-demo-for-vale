StylesPath = .github/vale/styles
MinAlertLevel = suggestion
Packages = Google
Vocab = Docs

[*.{md,mdx}]
BasedOnStyles = Vale, Google

# The pages quote deliberately "wrong" words and phrases as examples of what
# Vale flags (for example "In order to", "Click on", "Github"). Skip those
# quoted examples, and the "GitHub CLI" product name, rather than rewrite them.
TokenIgnores = ("(?:In order to|Click on)[^"]*"), ("(?:Github|Nodebalancer|recieve|deploybot|we)[^"]?"), (GitHub CLI), (above a Grade \d+)

# Rules that conflict with the docs' deliberate style:
# - Exclamation: "Congratulations!" closes the quickstart on purpose.
# - Anthropomorphism: "tells you"/"tells Vale" reads naturally for a tool and a config file.
# - Contractions: only fires on clause-final "it is"/"they are", which can't contract.
# - Headings: product names (Vale) and literal error messages as troubleshooting headings.
# - Colons: bold labels and "Part 1:" headings are followed by a capitalized sentence.
# - OxfordComma: false positives on "..., on a service like GitHub or GitLab" and "..., as in steps 3 and 4".
Google.Exclamation = NO
Google.Anthropomorphism = NO
Google.Contractions = NO
Google.Headings = NO
Google.Colons = NO
Google.OxfordComma = NO
